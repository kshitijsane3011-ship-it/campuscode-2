<!--

  Palette: Obsidian #080808 · Panel #121213 · Chrome #CDCBCA · Laser Red #D41514
  Fonts:   Bricolage Grotesque (display) · Inter (body) · JetBrains Mono (labels)

  SECTIONS
    <head>    Fonts, Tailwind CDN + theme tokens, GSAP, Lucide
    <style>   ===== THEME ===== tokens, surfaces, buttons, motion
    <body>    #app root, cursor glow, toasts
    <script>  ===== DATA ===== ===== UTILS ===== ===== AUTH ===== ===== ROUTER =====
              ===== LANDING ===== ===== AUTH PAGES ===== ===== SHELL ===== ===== PAGES =====
              ===== FX ===== ===== INIT =====

  RUN      Double-click this file, or host it on GitHub Pages / Vercel.
  LOGO     Put your logo at ./logo.png. Without it the "///" wordmark shows.
  EDIT     Colours: the :root block and the tailwind tokens in <head>.
           Content: the DATA object.
  LOGIN    Any valid email + 8+ character password. Session in localStorage "cc_session".
=====================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CampusCode</title>
  <meta name="description" content="CampusCode Hackathon Arena: events, teams, AI tools and certificates for students." />
  <meta name="theme-color" content="#080808" />
  <link rel="icon" href="logo.png" onerror="this.remove()" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'Inter', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            obsidian: '#080808',
            panel: '#121213',
            raised: '#1A1A1C',
            line: '#2E2E31',
            chrome: '#CDCBCA',
            muted: '#969496',
            red: { DEFAULT: '#D41514', hi: '#FF5A52', deep: '#7A0B0A' }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* ===== THEME ===== */
    :root {
      --obsidian: 8 8 8;        /* #080808 */
      --panel: 18 18 19;        /* #121213 */
      --raised: 26 26 28;       /* #1A1A1C */
      --line: 46 46 49;         /* #2E2E31 */
      --chrome: 205 203 202;    /* #CDCBCA */
      --muted: 150 148 150;     /* #969496 */
      --red: 212 21 20;         /* #D41514 */
      --red-hi: 255 90 82;      /* #FF5A52 */
      --red-deep: 122 11 10;    /* #7A0B0A */
    }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; background: #080808; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #080808;
      background-image:
        radial-gradient(900px 480px at 92% -12%, rgb(var(--red) / .12), transparent 60%),
        radial-gradient(700px 480px at -10% 40%, rgb(var(--chrome) / .05), transparent 60%);
      background-attachment: fixed;
      color: #E9E8E7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    h1, h2, h3, .display { font-family: "Bricolage Grotesque", Inter, sans-serif; letter-spacing: -0.03em; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    ::selection { background: #D41514; color: #fff; }
    :focus-visible { outline: 2px solid #FF5A52; outline-offset: 3px; border-radius: 8px; }

    #cursorGlow {
      position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px;
      border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, rgb(var(--red) / .10), transparent 60%);
    }
    #app { position: relative; z-index: 1; }

    /* Surfaces */
    .card {
      position: relative; background: linear-gradient(180deg, #1A1A1C 0%, #121213 100%);
      border: 1px solid rgb(var(--line)); border-radius: 26px; padding: 1.75rem;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .04), 0 20px 50px -28px rgba(0,0,0,.9);
      transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease, border-color .3s;
    }
    .card.lift:hover { transform: translateY(-3px); border-color: #4A4A4F; box-shadow: inset 0 1px 0 rgb(255 255 255 / .05), 0 30px 60px -30px rgba(0,0,0,.95); }
    .card-ink { background: #0C0C0D; border-color: #232326; }
    .card-red { background: linear-gradient(160deg, #D41514 0%, #7A0B0A 100%); border-color: #7A0B0A; color: #fff; }

    /* Buttons */
    .btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      height: 2.9rem; padding: 0 1.4rem; border-radius: 999px; overflow: hidden;
      font-family: "Bricolage Grotesque", Inter, sans-serif; font-weight: 700; font-size: .95rem; letter-spacing: -.01em;
      white-space: nowrap; cursor: pointer; border: 1px solid transparent;
      transition: transform .25s cubic-bezier(.2,.8,.2,1), background-color .25s, color .25s, box-shadow .3s, border-color .25s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; pointer-events: none; }
    .btn-red { background: #D41514; color: #fff; box-shadow: 0 14px 30px -14px rgba(212,21,20,.85); }
    .btn-red:hover { background: #7A0B0A; box-shadow: 0 18px 36px -14px rgba(212,21,20,.9); }
    .btn-chrome { background: linear-gradient(180deg, #E9E8E7, #CDCBCA 55%, #A6A4A3); color: #080808; box-shadow: 0 10px 26px -12px rgba(205,203,202,.45), inset 0 1px 0 #fff; }
    .btn-chrome:hover { box-shadow: 0 16px 34px -14px rgba(205,203,202,.6), inset 0 1px 0 #fff; }
    .btn-line { background: transparent; color: #E9E8E7; border-color: #3A3A3F; }
    .btn-line:hover { border-color: #CDCBCA; background: rgb(255 255 255 / .04); }
    .btn-sm { height: 2.4rem; padding: 0 1rem; font-size: .85rem; }
    .btn-lg { height: 3.4rem; padding: 0 2rem; font-size: 1.05rem; }

    /* Inputs */
    .label { display: block; font-family: "JetBrains Mono", monospace; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #969496; margin-bottom: .5rem; }
    .field {
      width: 100%; height: 3.1rem; border-radius: 16px; border: 1px solid #2E2E31; background: #0A0A0B;
      padding: 0 1.1rem; color: #F2F1F0; font-size: .97rem;
      transition: border-color .2s, box-shadow .2s, background-color .2s;
    }
    textarea.field { height: auto; min-height: 7rem; padding: .9rem 1.1rem; resize: vertical; }
    .field::placeholder { color: #5C5B5E; }
    .field:hover { border-color: #47474C; }
    .field:focus { outline: none; border-color: #D41514; box-shadow: 0 0 0 4px rgba(212,21,20,.18); background: #000; }
    .field[aria-invalid="true"] { border-color: #FF5A52; }
    select.field option { background: #121213; color: #F2F1F0; }

    /* Chips */
    .chip { display: inline-flex; align-items: center; gap: .4rem; border-radius: 999px; padding: .3rem .75rem; font-family: "JetBrains Mono", monospace; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .c-red { background: rgba(212,21,20,.16); color: #FF5A52; }
    .c-chrome { background: #CDCBCA; color: #080808; }
    .c-line { background: #1F1F22; color: #969496; }
    .c-ink { background: #E9E8E7; color: #080808; }
    .dot { width: .5rem; height: .5rem; border-radius: 999px; background: #D41514; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212,21,20,.6); } 100% { box-shadow: 0 0 0 10px rgba(212,21,20,0); } }

    /* Meters */
    .seg { height: .55rem; flex: 1; border-radius: 999px; background: #222225; }
    .seg.on { background: linear-gradient(90deg, #CDCBCA, #F2F1F0); }
    .seg.on.hot { background: linear-gradient(90deg, #7A0B0A, #D41514, #FF5A52); }
    .bar { height: .65rem; border-radius: 999px; background: #222225; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #7A0B0A, #D41514, #FF5A52); }

    /* Display type */
    .chrome-text { background: linear-gradient(180deg, #FFFFFF 0%, #CDCBCA 60%, #8A8988 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(3.2rem, 9vw, 7.5rem); line-height: .92; letter-spacing: -.045em; }
    .hl { background: linear-gradient(120deg, #FF5A52, #D41514); color: #fff; padding: 0 .18em; border-radius: .14em; }
    .big-num { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(3rem, 6vw, 5rem); letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }

    /* Sidebar */
    .rail {
      position: fixed; top: 0; bottom: 0; left: 0; width: 17rem; z-index: 60;
      display: flex; flex-direction: column; padding: 1.5rem 1.1rem;
      background: #050505; border-right: 1px solid #2E2E31; color: #E9E8E7;
      transform: translateX(-105%); transition: transform .5s cubic-bezier(.2,.8,.2,1);
    }
    .rail.open { transform: translateX(0); }
    @media (min-width: 1024px) { .rail { transform: none; } }
    .rail-link {
      display: flex; align-items: center; gap: .85rem; height: 2.7rem; padding: 0 .9rem; border-radius: 14px;
      color: #969496; font-size: .92rem; font-weight: 500; transition: background-color .2s, color .2s, transform .25s;
    }
    .rail-link i { transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .rail-link:hover { color: #fff; background: #121213; transform: translateX(3px); }
    .rail-link:hover i { transform: scale(1.12); }
    .rail-link.active { background: #1A1A1C; color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #D41514; }
    .rail-scroll { overflow-y: auto; scrollbar-width: none; }
    .rail-scroll::-webkit-scrollbar { display: none; }

    /* Tab bar */
    .tabbar {
      position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 55;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; padding: .45rem;
      background: rgba(12,12,13,.95); border: 1px solid #2E2E31; border-radius: 24px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 24px 50px -18px rgba(0,0,0,.9);
    }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .5rem 0; border-radius: 18px; color: #969496; font-family: "JetBrains Mono", monospace; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .tabbar a.active { background: #D41514; color: #fff; }
    @media (min-width: 1024px) { .tabbar { display: none; } }

    .topbar { background: rgba(8,8,8,.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #2E2E31; }

    /* Logo: chrome pill with a red "///" mark */
    .logo { display: inline-flex; align-items: center; gap: .65rem; }
    .logo img { height: 2rem; width: auto; }
    .logo-mark {
      display: inline-grid; place-items: center; height: 2.25rem; padding: 0 .55rem; border-radius: 12px;
      background: linear-gradient(180deg, #E9E8E7, #CDCBCA); color: #D41514;
      font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: .95rem; letter-spacing: -.12em;
      box-shadow: inset 0 1px 0 #fff, 0 8px 22px -10px rgba(205,203,202,.5);
    }
    .logo-text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; line-height: 1; color: #F2F1F0; }
    .logo-text small { display: block; font-family: "JetBrains Mono", monospace; font-size: .55rem; font-weight: 700; letter-spacing: .18em; color: #969496; margin-top: .3rem; }

    /* Ticker */
    .ticker { overflow: hidden; white-space: nowrap; border-block: 1px solid #2E2E31; background: #0C0C0D; }
    .ticker-track { display: inline-flex; gap: 3rem; padding: .9rem 0; animation: tick 28s linear infinite; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: #CDCBCA; }
    @keyframes tick { to { transform: translateX(-50%); } }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1); }
    .reveal.in { opacity: 1; transform: none; }

    .skel { border-radius: 26px; background: linear-gradient(90deg, #141415 25%, #1F1F22 50%, #141415 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .toast { animation: toastIn .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }

    @media (hover: none) { #cursorGlow { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      .reveal { opacity: 1; transform: none; }
      .btn:hover, .card.lift:hover, .rail-link:hover { transform: none; }
      #cursorGlow { display: none; }
    }
  </style>
</head>

/* ===== UTILS ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionOn = () => typeof window.gsap !== 'undefined' && !reduceMotion();
const refreshIcons = () => { if (window.lucide) window.lucide.createIcons(); };
const initials = (n) => n.split(' ').filter(Boolean).map((p) => p[0]).slice(0, 2).join('').toUpperCase();
const firstName = () => DATA.user.name.split(' ')[0];
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const app = () => $('#app');

function countUp(el, to) {
  if (!motionOn()) { el.textContent = Math.round(to).toLocaleString(); return; }
  const o = { v: 0 };
  gsap.to(o, { v: to, duration: 1.4, ease: 'power3.out', onUpdate: () => { el.textContent = Math.round(o.v).toLocaleString(); } });
}

function animateBars(root) {
  $$('[data-width]', root).forEach((el, i) => {
    const t = el.dataset.width + '%';
    if (motionOn()) gsap.to(el, { width: t, duration: 1.1, ease: 'power3.out', delay: 0.1 + i * 0.08 });
    else el.style.width = t;
  });
  if (motionOn()) gsap.fromTo($$('[data-seg]', root), { scaleX: 0.2, opacity: 0.3 }, { scaleX: 1, opacity: 1, duration: 0.35, stagger: 0.03, ease: 'power2.out', transformOrigin: 'left' });
}

function tiltCards(root = document) {
  if (!motionOn() || matchMedia('(hover: none)').matches) return;
  $$('.tilt', root).forEach((el) => {
    if (el.dataset.tilt) return;
    el.dataset.tilt = '1';
    el.addEventListener('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      gsap.to(el, { rotateY: ((e.clientX - r.left) / r.width - 0.5) * 6, rotateX: -((e.clientY - r.top) / r.height - 0.5) * 6, transformPerspective: 1000, duration: 0.4, ease: 'power2.out' });
    });
    el.addEventListener('mouseleave', () => gsap.to(el, { rotateX: 0, rotateY: 0, duration: 0.7, ease: 'elastic.out(1, .5)' }));
  });
}

function magnetize(root = document) {
  if (!motionOn() || matchMedia('(hover: none)').matches) return;
  $$('.btn', root).forEach((el) => {
    if (el.dataset.mag) return;
    el.dataset.mag = '1';
    el.addEventListener('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      gsap.to(el, { x: (e.clientX - r.left - r.width / 2) * 0.14, y: (e.clientY - r.top - r.height / 2) * 0.22, duration: 0.3, ease: 'power2.out' });
    });
    el.addEventListener('mouseleave', () => gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, .4)' }));
  });
}

function toast(msg, tone = 'success') {
  const el = document.createElement('div');
  el.className = 'toast card pointer-events-auto flex items-center gap-3 !rounded-2xl !p-4 text-sm font-semibold shadow-[0_20px_40px_-20px_rgba(0,0,0,.9)]';
  el.setAttribute('role', 'status');
  el.innerHTML = `<i data-lucide="${tone === 'error' ? 'circle-alert' : 'circle-check'}" class="h-4 w-4 shrink-0 ${tone === 'error' ? 'text-[#FF5A52]' : 'text-chrome'}" aria-hidden="true"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  refreshIcons();
  setTimeout(() => {
    if (motionOn()) gsap.to(el, { opacity: 0, y: 8, duration: 0.3, onComplete: () => el.remove() });
    else el.remove();
  }, 3000);
}

function setFieldError(input, msg) {
  const id = `${input.id}-err`;
  let err = document.getElementById(id);
  if (!msg) {
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    if (err) err.remove();
    return false;
  }
  input.setAttribute('aria-invalid', 'true');
  input.setAttribute('aria-describedby', id);
  if (!err) {
    err = document.createElement('p');
    err.id = id;
    err.setAttribute('role', 'alert');
    err.className = 'mt-2 text-xs font-semibold text-[#FF5A52]';
    input.parentElement.appendChild(err);
  }
  err.textContent = msg;
  return true;
}

function bindValidation(form, rules) {
  const check = (name) => !setFieldError(form.elements.namedItem(name), rules[name](form.elements.namedItem(name).value));
  Object.keys(rules).forEach((name) => {
    const el = form.elements.namedItem(name);
    el.addEventListener('blur', () => { el.dataset.touched = '1'; check(name); });
    el.addEventListener('input', () => { if (el.dataset.touched) check(name); });
    el.addEventListener('change', () => { if (el.dataset.touched) check(name); });
  });
  return () => {
    let ok = true, first = null;
    Object.keys(rules).forEach((name) => {
      form.elements.namedItem(name).dataset.touched = '1';
      if (!check(name)) { ok = false; first = first || form.elements.namedItem(name); }
    });
    if (first) first.focus();
    return ok;
  };
}

const eyeIcon = (show) => `<i data-lucide="${show ? 'eye-off' : 'eye'}" class="h-4 w-4" aria-hidden="true"></i>`;

function setupPasswordToggles(root = document) {
  $$('[data-toggle-pw]', root).forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.togglePw);
      const reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      btn.innerHTML = eyeIcon(reveal);
      refreshIcons();
    });
  });
}

async function withLoading(btn, label, task) {
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = `<i data-lucide="loader-circle" class="h-4 w-4 animate-spin" aria-hidden="true"></i><span>${label}</span>`;
  refreshIcons();
  try {
    await sleep(motionOn() ? 700 : 100);
    await task();
  } catch (err) {
    toast(err.message || 'Something went wrong. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.innerHTML = original;
    refreshIcons();
  }
}

const go = (hash) => { if (location.hash !== hash) location.hash = hash; else route(); };

function route() {
  const [a, b] = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!a || !['landing', 'login', 'register', 'dashboard'].includes(a)) return go('#/landing');
  if (a !== 'dashboard') { shellMounted = false; lastPage = null; }
  if (a === 'landing') return renderLanding();
  if (a === 'login') return authed() ? go('#/dashboard/overview') : renderLogin();
  if (a === 'register') return authed() ? go('#/dashboard/overview') : renderRegister();
  if (!authed()) return go('#/login');
  if (!b || !PAGE_ORDER.includes(b)) return go('#/dashboard/overview');
  renderDashboard(b);
}

function setupLandingMotion() {
  const reduce = reduceMotion();
  if (motionOn()) {
    gsap.fromTo('.hero-in', { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, stagger: 0.12, ease: 'power3.out' });
  } else {
    $$('.hero-in').forEach((el) => { el.style.opacity = 1; });
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold: 0.12 });
  $$('.reveal').forEach((r) => io.observe(r));
  if (reduce) $$('.reveal').forEach((r) => r.classList.add('in'));

  const cio = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { countUp(en.target, Number(en.target.dataset.count)); cio.unobserve(en.target); } });
  }, { threshold: 0.5 });
  $$('[data-count]').forEach((c) => cio.observe(c));

  tiltCards(app());
  magnetize(app());
}

  const COLORS = ['bg-red', 'bg-red', 'bg-[#8A8988]', 'bg-chrome', 'bg-white'];
  const score = (pw) => {
    if (!pw) return 0;
    let s = 0;
    if (pw.length >= 8) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
    if (/\d/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return s;
  };
  const drawStrength = (pw) => {
    const s = score(pw);
    $('#pwBars').innerHTML = [0, 1, 2, 3].map((i) => `<span class="h-2 flex-1 rounded-full transition-colors duration-300 ${i < s ? COLORS[s] : 'bg-raised'}"></span>`).join('');
    $('#pwLabel').textContent = pw ? `Strength: ${LABELS[s]}` : 'Use 8+ characters with mixed case, numbers or symbols.';
  };
  drawStrength('');

  const form = $('#registerForm');
  const validate = bindValidation(form, {
    name: (v) => (v.trim().length >= 2 ? '' : 'Enter your full name.'),
    college: (v) => (v.trim() ? '' : 'Enter your college name.'),
    branch: (v) => (v ? '' : 'Select your branch.'),
    year: (v) => (v ? '' : 'Select your year.'),
    email: (v) => (EMAIL_RE.test(v.trim()) ? '' : 'Enter a valid email address.'),
    password: (v) => (score(v) >= 2 ? '' : 'Use 8+ characters with mixed case, numbers or symbols.')
  });
  form.elements.namedItem('password').addEventListener('input', (e) => drawStrength(e.target.value));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!validate()) return;
    const f = form.elements;
    withLoading(form.querySelector('button[type="submit"]'), 'Creating account…', async () => {
      DATA.user = {
        ...DATA.user,
        name: f.namedItem('name').value.trim(),
        college: f.namedItem('college').value.trim(),
        branch: f.namedItem('branch').value,
        year: f.namedItem('year').value,
        email: f.namedItem('email').value.trim()
      };
      setSession(true);
      toast(`Welcome to CampusCode, ${firstName()}!`);
      go('#/dashboard/overview');
    });
  });
}

function bindShell() {
  const sidebar = $('#sidebar');
  const scrim = $('#scrim');
  const openDrawer = (open) => {
    sidebar.classList.toggle('open', open);
    scrim.hidden = !open;
    $('#menuBtn').setAttribute('aria-expanded', String(open));
    if (open) sidebar.querySelector('a')?.focus();
  };
  $('#menuBtn').addEventListener('click', () => openDrawer(true));
  $('#closeDrawer').addEventListener('click', () => openDrawer(false));
  scrim.addEventListener('click', () => openDrawer(false));
  sidebar.addEventListener('click', (e) => { if (e.target.closest('a') && innerWidth < 1024) openDrawer(false); });

  const closeMenus = () => { $('#userMenu').hidden = true; $('#userBtn').setAttribute('aria-expanded', 'false'); };
  $('#userBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const menu = $('#userMenu');
    const willOpen = menu.hidden;
    closeMenus();
    if (willOpen) {
      menu.hidden = false;
      $('#userBtn').setAttribute('aria-expanded', 'true');
      if (motionOn()) gsap.fromTo(menu, { opacity: 0, y: -6, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: 'power2.out' });
    }
  });
  $('#logoutBtn').addEventListener('click', logout);
  document.addEventListener('click', (e) => { if (!$('#userWrap').contains(e.target)) closeMenus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeMenus(); openDrawer(false); } });

  const unread = DATA.notifications.filter((n) => !n.read).length;
  const bell = $('#bellCount');
  bell.textContent = unread;
  bell.hidden = unread === 0;

  $('#globalSearch').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const q = e.target.value.trim();
    if (q) toast(`Searching for “${q}”…`);
  });

  magnetize(app());
  shellMounted = true;
}

/* ===== DASHBOARD PAGES ===== */
const LABEL = Object.fromEntries(DATA.nav.map((n) => [n.slug, n.label]));

function renderDashboard(slug) {
  if (!shellMounted) {
    app().innerHTML = shellHTML();
    bindShell();
    refreshIcons();
    if (motionOn()) gsap.fromTo('#sidebar', { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out', clearProps: 'transform' });
  }
  $$('[data-nav], [data-tab]').forEach((a) => {
    const key = a.dataset.nav || a.dataset.tab;
    const on = key === slug;
    a.classList.toggle('active', on);
    if (a.dataset.nav) {
      if (on) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
  });
  $('#crumb').textContent = LABEL[slug];
  document.title = `${LABEL[slug]} · CampusCode`;

  const from = lastPage;
  const my = ++pageToken;
  $('#page').innerHTML = skeleton();
  refreshIcons();
  loadPage(slug, my, from);
}

async function loadPage(slug, my, from) {
  await sleep(motionOn() ? DATA.config.latencyMs : 100);
  if (my !== pageToken) return;
  const page = $('#page');

  if (DATA.config.simulateError) {
    page.innerHTML = errorBox('We could not load this page. Check your connection and try again.');
    refreshIcons();
    $('[data-retry]', page).addEventListener('click', () => renderDashboard(slug));
    return;
  }

  page.innerHTML = PAGES[slug]();
  refreshIcons();
  bindPage(slug);
  lastPage = slug;
  page.querySelector('h1')?.focus({ preventScroll: true });

  if (motionOn()) {
    // Pages further down the menu enter from the right, higher ones from the left.
    const dir = from && PAGE_ORDER.indexOf(slug) < PAGE_ORDER.indexOf(from) ? -1 : 1;
    const x = from ? 70 * dir : 0;
    gsap.fromTo(page, { opacity: 0, x }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out', clearProps: 'transform' });
    gsap.fromTo(page.children, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, stagger: 0.05, ease: 'power3.out', delay: 0.08, clearProps: 'transform' });
  }
}

function ideacheckPage() {

        <div><label for="icIdea" class="label">Describe your idea</label>
          <textarea id="icIdea" name="idea" class="field min-h-[12rem]" placeholder="Problem, who it helps, and how it works in 3–5 sentences."></textarea></div>
        <button type="submit" class="btn btn-chrome">Check idea</button>
      </form>
      <article id="icResult" class="card" aria-live="polite">
        ${emptyBox('lightbulb', 'No report yet', 'Submit an idea to see scores for novelty, feasibility and impact.')}
      </article>
    </div>
  </div>`;
}
function ideaReport(text) {
  const words = text.trim().split(/\s+/).length;
  const hits = ['ai', 'campus', 'student', 'iot', 'sustainable', 'data', 'health', 'mobile'].filter((k) => text.toLowerCase().includes(k)).length;
  const base = Math.min(words, 60) / 60;
  const score = (x) => Math.max(40, Math.min(96, Math.round(45 + x * 40 + hits * 3)));
  const metrics = [
    { label: 'Novelty', value: score(base) },
    { label: 'Feasibility in 48h', value: score(1 - base * 0.5) },
    { label: 'Impact on students', value: score(base + hits * 0.05) }
  ];
  const overall = Math.round(metrics.reduce((s, m) => s + m.value, 0) / metrics.length);
  return `
    <div class="flex items-center justify-between">
      <h2 class="display text-2xl font-bold">Report</h2>
      <span class="chip c-ink">Overall ${overall}/100</span>
    </div>
    <div class="mt-8 space-y-6">
      ${metrics.map((m) => `
        <div>
          <div class="mb-2 flex justify-between text-sm"><span class="font-semibold">${m.label}</span><span class="mono text-muted">${m.value}</span></div>
          <div class="bar" role="progressbar" aria-label="${m.label}" aria-valuenow="${m.value}" aria-valuemin="0" aria-valuemax="100"><i data-width="${m.value}" style="width:0%"></i></div>
        </div>`).join('')}
    </div>
    <p class="mt-8 rounded-2xl border border-line bg-raised p-5 text-sm text-chrome">Tip: ${words < 25 ? 'Add more detail about the user and the main flow. Reviewers score clarity.' : 'Narrow the scope to one core feature for a strong 48-hour demo.'}</p>`;
}

  notifications: notificationsPage,
  help: helpPage,
  profile: profilePage,
  settings: settingsPage
};

function bindPage(slug) {
  const page = $('#page');
  setupPasswordToggles(page);
  $$('[data-count]', page).forEach((el) => countUp(el, Number(el.dataset.count)));
  animateBars(page);
  tiltCards(page);
  magnetize(page);

  page.addEventListener('click', (e) => {
    const b = e.target.closest('[data-toast]');
    if (b) toast(b.dataset.toast);
  });

  if (slug === 'events') {
    renderEventGrid();
    page.addEventListener('click', (e) => {
      const f = e.target.closest('[data-filter-event]');
      if (f) {
        eventFilter = f.dataset.filterEvent;
        $$('[data-filter-event]', page).forEach((x) => {
          const on = x.dataset.filterEvent === eventFilter;
          x.classList.toggle('btn-chrome', on);
          x.classList.toggle('btn-line', !on);
          x.setAttribute('aria-pressed', String(on));
        });
        renderEventGrid();
        return;
      }
      const reg = e.target.closest('[data-register]');
      if (reg) {
        const ev = DATA.events.find((x) => x.id === reg.dataset.register);
        if (!ev) return;
        ev.registered = !ev.registered;
        renderEventGrid();
        toast(ev.registered ? `Registered for ${ev.title}.` : `Removed ${ev.title}.`);
      }
    });
  }

  if (slug === 'communication') {
    renderComm();
    page.addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter-comm]');
      if (!b) return;
      commFilter = b.dataset.filterComm;
      $$('[data-filter-comm]', page).forEach((x) => {
        const on = x.dataset.filterComm === commFilter;
        x.classList.toggle('btn-chrome', on);
        x.classList.toggle('btn-line', !on);
        x.setAttribute('aria-pressed', String(on));
      });
      renderComm();
    });
  }

  if (slug === 'hackmate') {
    $('#hmForm').addEventListener('submit', (e) => {
      e.preventDefault();
      withLoading(e.target.querySelector('button[type="submit"]'), 'Finding…', async () => {
        const ranked = [...DATA.teammates].sort((a, b) => b.match - a.match);
        $('#hmResults').innerHTML = ranked.map(teammateCard).join('');
        refreshIcons();
        tiltCards($('#hmResults'));
        toast('Matches updated for your team.');
      });
    });
  }

  if (slug === 'ideacheck') {
    $('#icForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('#icIdea').value.trim();
      if (text.length < 20) { setFieldError($('#icIdea'), 'Add at least 20 characters so we can review it.'); return; }
      setFieldError($('#icIdea'), '');
      withLoading(e.target.querySelector('button[type="submit"]'), 'Analysing…', async () => {
        const box = $('#icResult');
        box.innerHTML = ideaReport(text);
        refreshIcons();
        animateBars(box);
      });
    });
  }

  if (slug === 'rulebot') bindRulebot(page);

  if (slug === 'notifications') {
    $('#markAll').addEventListener('click', () => {
      DATA.notifications.forEach((n) => { n.read = true; });
      const bell = $('#bellCount');
      if (bell) bell.hidden = true;
      page.innerHTML = notificationsPage();
      refreshIcons();
      toast('All notifications marked as read.');
    });
  }

  if (slug === 'help') {
    const form = $('#helpForm');
    const validate = bindValidation(form, {
      subject: (v) => (v ? '' : 'Choose a topic.'),
      message: (v) => (v.trim().length >= 10 ? '' : 'Message must be at least 10 characters.')
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validate()) return;
      form.reset();
      toast('Message sent. We will reply within 24 hours.');
    });
  }

  if (slug === 'profile') {
    const form = $('#profileForm');
    const validate = bindValidation(form, {
      name: (v) => (v.trim().length >= 2 ? '' : 'Enter your full name.'),
      college: (v) => (v.trim() ? '' : 'Enter your college name.'),
      branch: (v) => (v ? '' : 'Select your branch.'),
      year: (v) => (v ? '' : 'Select your year.')
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validate()) return;
      const f = form.elements;
      DATA.user = { ...DATA.user, name: f.namedItem('name').value.trim(), college: f.namedItem('college').value.trim(), branch: f.namedItem('branch').value, year: f.namedItem('year').value };
      $('#profAvatar').textContent = initials(DATA.user.name);
      toast('Profile saved.');
    });
  }

  if (slug === 'digital-card') {
    $('#copyLink').addEventListener('click', async () => {
      const input = $('#cardLink');
      try { await navigator.clipboard.writeText(input.value); toast('Card link copied.'); }
      catch (err) { input.select(); toast('Press Ctrl+C to copy the link.', 'error'); }
    });
  }

  if (slug === 'settings') {
    page.addEventListener('click', (e) => {
      const sw = e.target.closest('[data-switch]');
      if (sw) sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
      if (e.target.closest('#saveSettings')) {
        $$('[data-switch]', page).forEach((s) => { DATA.settings.notifications[s.dataset.switch] = s.getAttribute('aria-checked') === 'true'; });
        toast('Settings saved.');
      }
    });
  }
}

function bindRulebot(page) {
  const log = $('#chatLog');
  const add = (who, text) => {
    const row = document.createElement('div');
    row.className = `flex gap-3 ${who === 'me' ? 'justify-end' : ''}`;
    row.innerHTML = who === 'me'
      ? `<p class="max-w-prose rounded-3xl rounded-tr-md bg-red px-5 py-3.5 text-sm text-white">${esc(text)}</p>`
      : `<span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-chrome"><i data-lucide="bot" class="h-4 w-4 text-obsidian" aria-hidden="true"></i></span><p class="max-w-prose rounded-3xl rounded-tl-md bg-raised px-5 py-3.5 text-sm">${esc(text)}</p>`;
    log.appendChild(row);
    refreshIcons();
    if (motionOn()) gsap.fromTo(row, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' });
    log.scrollTop = log.scrollHeight;
  };
  const ask = async (q) => {
    if (!q.trim()) return;
    add('me', q);
    const typing = document.createElement('p');
    typing.className = 'mono text-xs text-muted';
    typing.textContent = 'RuleBot is typing…';
    log.appendChild(typing);
    await sleep(reduceMotion() ? 0 : 600);
    typing.remove();
    add('bot', botAnswer(q));
  };
  $('#chatForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#chatInput');
    const q = input.value;
    input.value = '';
    ask(q);
  });
  page.addEventListener('click', (e) => {
    const s = e.target.closest('[data-suggest]');
    if (s) ask(s.dataset.suggest);
  });
}

/* ===== FX ===== */
function initCursorGlow() {
  const glow = $('#cursorGlow');
  if (!glow || reduceMotion() || matchMedia('(hover: none)').matches || !window.gsap) return;
  const xTo = gsap.quickTo(glow, 'x', { duration: 0.6, ease: 'power3' });
  const yTo = gsap.quickTo(glow, 'y', { duration: 0.6, ease: 'power3' });
  window.addEventListener('pointermove', (e) => { xTo(e.clientX); yTo(e.clientY); });
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded', () => {
  initCursorGlow();
  window.addEventListener('hashchange', route);
  route();
});
</script>
</body>
